<html lang="es">
<head>

<title>Facturas NWS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef4f8;--card:#fff;--soft:#f4f8fb;--ink:#0b1f3a;--ink2:#334155;--gray:#5b6b80;--muted:#8794a6;--line:#d9e4ec;--brand:#0a3d62;--cyan:#0e8fc7;--cyan-d:#0b7fb3;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
--good:#047857;--good-bg:#e7f6ef;--warn:#b45309;--warn-bg:#fff4e0;--bad:#b91c1c;--bad-bg:#fdecec;--info:#0b7fb3;--info-bg:#e8f4fc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--card:#152131;--soft:#1b2a3d;--ink:#eef2f7;--ink2:#cfd8e3;--gray:#9fb0c4;--muted:#7d8ea3;--line:#26364b;--cyan:#38b6ee;--cyan-d:#7cd0f5;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--good:#4ade80;--good-bg:#12352a;--warn:#fbbf24;--warn-bg:#3a2c10;--bad:#f87171;--bad-bg:#3b1a1a;--info:#7cd0f5;--info-bg:#12304a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1622;--card:#152131;--soft:#1b2a3d;--ink:#eef2f7;--ink2:#cfd8e3;--gray:#9fb0c4;--muted:#7d8ea3;--line:#26364b;--cyan:#38b6ee;--cyan-d:#7cd0f5;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--good:#4ade80;--good-bg:#12352a;--warn:#fbbf24;--warn-bg:#3a2c10;--bad:#f87171;--bad-bg:#3b1a1a;--info:#7cd0f5;--info-bg:#12304a;color-scheme:dark}
*{box-sizing:border-box}
header{background:linear-gradient(90deg,#0a3d62,#0e8fc7)!important}
nav button[aria-current=page]{background:#0a3d62!important;color:#fff!important}nav button[aria-current=page] .n{background:rgba(255,255,255,.2)!important;color:#fff!important}
.kpi{border-top:4px solid var(--cyan)!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Public Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;max-width:1360px;margin:0 auto}
.top img{height:24px;background:#fff;border-radius:4px;padding:2px 4px}
.top h1{font:800 17px Montserrat,sans-serif;margin:0;flex:1;letter-spacing:.01em}
.quien{font-size:13px;opacity:.9}.quien button{background:none;border:0;color:#7dd3fc;text-decoration:underline;cursor:pointer;padding:0}
.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
nav{position:sticky;top:66px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--gray);font-weight:600;text-align:left}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:var(--card);color:var(--ink)}
nav button[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(11,31,58,.08)}
nav .n{margin-left:auto;font-size:12px;background:var(--soft);border-radius:999px;padding:1px 8px;color:var(--gray)}
nav button[aria-current=page] .n{background:var(--info-bg);color:var(--info)}
main{min-width:0}
.ttl{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ttl h2{font:800 22px Montserrat,sans-serif;margin:0}.ttl p{margin:2px 0 0;color:var(--gray);font-size:14px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto}.seg button{flex:none}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--card);min-width:0}
.filtros select{font-weight:600}.selest{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gray)}.selest select{padding:4px 8px;font-weight:600;color:var(--ink)}.filtros input[type=search]{flex:1;min-width:160px}
button.b{font-weight:600;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--cyan);color:#fff;white-space:nowrap}
button.b:hover{background:var(--cyan-d)}button.b:disabled{opacity:.5;cursor:default}
button.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.g{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--gray);padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}button.g:hover{color:var(--ink);background:var(--soft)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}@media (min-width:1280px){.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k6 .kpi b{font-size:19px}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font:800 22px Montserrat,sans-serif;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{color:var(--muted);font-size:12px}.kpi small.bad{color:var(--bad);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px}.panel .sub{margin:0 0 12px;color:var(--gray);font-size:13px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--gray);margin-bottom:6px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--brand);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:20;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:240px}
.tip b{display:block;font-size:13px}
.tabla{overflow-x:auto}
.hbars{display:flex;flex-direction:column;gap:10px}.hb{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr);gap:10px;align-items:center;font-size:13px;cursor:default}
.hl{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ht{display:flex;align-items:center;gap:8px;min-width:0}.ht i{display:block;height:18px;border-radius:0 4px 4px 0;flex:none;max-width:calc(100% - 92px)}.ht em{font-style:normal;font-weight:700;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--gray);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--soft)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-weight:600;font-size:12px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-por{background:var(--warn-bg);color:var(--warn)}.t-emi{background:var(--info-bg);color:var(--info)}.t-pag{background:var(--good-bg);color:var(--good)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-gris{background:var(--soft);color:var(--gray)}
.vacio{text-align:center;color:var(--gray);padding:30px}
.fila{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.fila.foco{box-shadow:0 0 0 2px var(--cyan)}
.cli{font-weight:700}.cli small{font-weight:400;color:var(--gray);margin-left:6px}
.glosa{font-size:14px;color:var(--ink2);grid-column:1}
.monto{text-align:right;grid-row:1/3;grid-column:2}.monto b{font:800 17px Montserrat,sans-serif;display:block}.monto small{color:var(--gray);font-size:12px}
.meta{font-size:12px;color:var(--gray);display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
.oc{grid-column:1/-1;font-size:13px;background:var(--info-bg);color:var(--info);border-radius:9px;padding:7px 11px;font-weight:600}
.oc.falta{background:var(--warn-bg);color:var(--warn)}
.docs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.doc{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:4px 9px;cursor:pointer;font-size:13px}
.doc i{font-style:normal;color:var(--gray);font-size:11px;font-weight:700;text-transform:uppercase;margin-right:4px}
.acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.acc input[type=text]{width:120px}.acc input[type=date]{width:155px}
.acc .der{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.detalle{grid-column:1/-1;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.detalle h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray)}
.nota{margin-bottom:6px}.nota b{font-size:12px;color:var(--gray)}
.detalle form{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.detalle form input{flex:1;min-width:160px}
.pasos{grid-column:1/-1;display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--muted);flex-wrap:wrap;gap:2px 0}
.pasos span{display:flex;align-items:center;gap:5px;padding-right:12px}
.pasos span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.pasos span.ok{color:var(--good)}.pasos span.ok::before{background:var(--good)}
.pasos span.ya{color:var(--ink)}.pasos span.esp{color:var(--warn)}.pasos span.esp::before{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}.pasos span.ya::before{background:var(--cyan);box-shadow:0 0 0 3px var(--info-bg)}
.alerta{background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.alerta h3{margin:0 0 8px;font-size:15px;color:var(--warn)}
.alerta .item{background:var(--card);border-radius:10px;padding:10px 12px;margin-top:8px}
.nueva{background:var(--card);border:1px solid var(--cyan);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nueva label{font-size:12px;font-weight:600;color:var(--gray);display:flex;flex-direction:column;gap:4px}
.nueva input,.nueva select,.nueva textarea{width:100%}.nueva .x2{grid-column:span 2}.nueva .x4{grid-column:1/-1}
.mas{display:block;margin:10px auto 0}
#aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
.bloq{max-width:400px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.bloq h2{font:800 20px Montserrat,sans-serif;margin:0 0 6px}
.cargando{padding:60px;text-align:center;color:var(--gray)}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:820px){.shell{grid-template-columns:1fr;gap:12px}nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}nav button{white-space:nowrap;padding:8px 11px;background:var(--card);border:1px solid var(--line)}nav button[aria-current=page]{border-color:var(--brand)}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:18px}.fila{grid-template-columns:1fr}.monto{grid-row:auto;grid-column:1;text-align:left}.nueva{grid-template-columns:1fr 1fr}.nueva .x2{grid-column:1/-1}.acc .der{margin-left:0}td,th{padding:7px 6px}table{font-size:12.5px}}
</style>
</head>
<body>
<header><div class="top"><img src="../sinthesi-cctv/logo.png" alt="NWS"><h1>Facturas</h1><div class="quien" id="quien"></div></div></header>
<div id="app"><p class="cargando">Cargando…</p></div>
<div id="aviso" role="status"></div><div class="tip" id="tip"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var API = 'https://camuxwyvvldqlmsmfbju.supabase.co/functions/v1/facturas-contador';
  var sb = window.supabase.createClient('https://camuxwyvvldqlmsmfbju.supabase.co', 'sb_publishable_jeJlfqULfC7x6iUZrXjl8A_8zB5oVAm', { auth: { storageKey: 'nws-facturas-sesion', persistSession: true, autoRefreshToken: true } });
  var TOKEN = '';
  var app = document.getElementById('app');
  var guardar = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var leer = function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
  var S = { filas: [], cots: [], ocs: [], facs: [], admin: false, vista: leer('nws-fact-vista', 'resumen'), emp: '', per: leer('nws-fact-per', 'anio'), q: '', estF: 'pend', abiertas: {}, detalle: {}, nueva: false, quien: '', foco: null, verCot: 30 };
  var clp = function (n) { return '$' + Math.round(Number(n) || 0).toLocaleString('es-CL'); };
  var clpC = function (n) { n = Number(n) || 0; return n >= 1e6 ? '$' + (n / 1e6).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + ' mil' : clp(n); };
  var fch = function (d) { return d ? String(d).slice(0, 10).split('-').reverse().join('-') : ''; };
  var hoy = function () { var d = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4); return d.toISOString().slice(0, 10); };
  var dias = function (a, b) { return Math.round((new Date(b || hoy()) - new Date(String(a).slice(0, 10))) / 864e5); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  // Las razones sociales vienen escritas de varias formas («KDM S.A», «KDM SA»): se agrupan por una clave normalizada.
  var clave = function (s) { return String(s || '—').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\b(S\.?\s?A\.?|SPA|LTDA\.?|LIMITADA)\b/g, '').replace(/[^A-Z0-9]/g, ''); };
  var NOMBRES = {};
  var nombreEmp = function (s) { var k = clave(s); if (!NOMBRES[k] || String(s).length > NOMBRES[k].length) NOMBRES[k] = String(s || '—').trim(); return k; };

  function aviso(t) { var a = document.getElementById('aviso'); a.textContent = t; a.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.style.display = 'none'; }, 3200); }
  function api(accion, datos) {
    return fetch(API, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + TOKEN }, body: JSON.stringify(Object.assign({ accion: accion }, datos || {})) })
      .then(function (r) { return r.json().then(function (j) { if (j.login) { login(j.error); throw new Error(j.error); } if (!r.ok) throw new Error(j.error || 'Error'); return j; }); });
  }
  function cargar() {
    return api('lista').then(function (j) {
      S.filas = j.filas || []; S.cots = j.cotizaciones || []; S.ocs = j.ocs || []; S.facs = j.facturas || [];
      S.filas.forEach(function (f) { f.k = nombreEmp(f.razon_social); }); S.cots.forEach(function (c) { c.k = nombreEmp(c.cliente); }); S.facs.forEach(function (f) { f.k = nombreEmp(f.cliente); });
      pintar();
    }).catch(function (e) { if (S.quien) app.innerHTML = '<div class="bloq"><h2>No se pudo cargar</h2><p>' + esc(e.message) + '</p></div>'; });
  }
  function abrirUrl(p) { var w = window.open('', '_blank'); p.then(function (j) { if (w) w.location.href = j.url; else location.href = j.url; }, function (e) { if (w) w.close(); aviso(e.message); }); }
  function elegirArchivo(accept, cb) { var i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.onchange = function () { if (i.files[0]) cb(i.files[0]); }; i.click(); }
  function put(url, file) { return fetch(url, { method: 'PUT', headers: { 'content-type': file.type || 'application/octet-stream', 'x-upsert': 'false' }, body: file }).then(function (r) { if (!r.ok) throw new Error('No se pudo subir el archivo.'); }); }
  function subirDoc(dueno, tipo, file, visible) {
    var base = Object.assign({ tipo: tipo, nombre: file.name }, dueno);
    return api('subir_doc', base).then(function (j) { return put(j.url, file).then(function () { return api('doc_listo', Object.assign({ path: j.path, visible_contador: visible }, base)); }); });
  }

  // ---------- Sesión ----------
  function pintarQuien() {
    document.getElementById('quien').innerHTML = S.quien ? esc(S.quien) + ' · <button id="salir">cerrar sesión</button>' : '';
    var c = document.getElementById('salir'); if (c) c.onclick = function () { sb.auth.signOut().then(function () { TOKEN = ''; login(); }); };
  }
  function login(msg) {
    S.quien = ''; pintarQuien();
    app.innerHTML = '<form class="bloq" id="flogin"><h2>Facturas NWS</h2><p style="color:var(--gray);margin:0 0 14px">Entra con tu cuenta del ERP.</p>' +
      (msg && msg !== 'Inicia sesión.' ? '<p style="color:var(--bad)">' + esc(msg) + '</p>' : '') +
      '<div style="display:grid;gap:10px;text-align:left"><label style="font-size:13px;font-weight:600;color:var(--gray)">Correo<input name="email" type="email" autocomplete="username" required style="width:100%;margin-top:4px"></label>' +
      '<label style="font-size:13px;font-weight:600;color:var(--gray)">Clave<input name="password" type="password" autocomplete="current-password" required style="width:100%;margin-top:4px"></label>' +
      '<button class="b" style="padding:11px">Entrar</button><p id="lerr" style="color:var(--bad);margin:0;font-size:14px"></p>' +
      '<p style="color:var(--gray);font-size:13px;margin:0">¿Olvidaste tu clave? Pídele a Jerry que te la restablezca.</p></div></form>';
    var f = document.getElementById('flogin');
    f.onsubmit = function (e) {
      e.preventDefault(); var btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Entrando…';
      sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value }).then(function (r) {
        if (r.error) { btn.disabled = false; btn.textContent = 'Entrar'; document.getElementById('lerr').textContent = /invalid/i.test(r.error.message) ? 'Correo o clave incorrectos.' : r.error.message; return; }
        TOKEN = r.data.session.access_token; entrar();
      });
    };
  }
  function entrar() { api('yo').then(function (j) { S.quien = j.nombre; S.admin = !!j.admin; if (!S.admin && (S.vista === 'cot' || S.vista === 'oc')) S.vista = 'resumen'; pintarQuien(); app.innerHTML = '<p class="cargando">Cargando…</p>'; cargar(); }).catch(function () {}); }

  // ---------- Filtros ----------
  function desdePer() {
    var d = new Date(hoy() + 'T12:00:00'), y = d.getFullYear(), m = d.getMonth();
    if (S.per === 'mes') return y + '-' + String(m + 1).padStart(2, '0') + '-01';
    if (S.per === 'trim') { var t = new Date(y, m - 2, 1); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-01'; }
    if (S.per === 'anio') return y + '-01-01';
    return '0000';
  }
  var enPer = function (f) { return !!f && String(f).slice(0, 10) >= desdePer(); };
  var enEmp = function (x) { return !S.emp || x.k === S.emp; };
  var conQ = function (txt) { var q = S.q.toLowerCase(); return !q || txt.toLowerCase().indexOf(q) >= 0; };
  function empresas() {

      if (act === 'pagada') { b.disabled = true; api('pagada', { id: id, fecha_pago: app.querySelector('[data-fp="' + id + '"]').value }).then(hecho('Marcada como pagada.'), mal); return; }
      if (act === 'quitar') {
        if (b.dataset.ok) { b.disabled = true; api('anular', { id: id }).then(hecho('Quitada de la lista.'), mal); return; }
        b.dataset.ok = '1'; b.textContent = '¿Seguro? Quitar'; b.style.color = 'var(--bad)'; return;
      }
      if (act === 'ver') { abrirUrl(api('ver_pdf', { id: id })); return; }
      if (act === 'pdf') {
        elegirArchivo('application/pdf', function (file) {
          aviso('Subiendo PDF…');
          api('subir_pdf', { id: id }).then(function (j) { return put(j.url, file).then(function () { return api('pdf_listo', { id: id, path: j.path }); }); }).then(hecho('PDF de la factura subido.'), mal);
        });
      }
    });
  }
  document.addEventListener('scroll', tipOff, { passive: true });
  sb.auth.onAuthStateChange(function (ev, ses) { TOKEN = ses ? ses.access_token : ''; });
  sb.auth.getSession().then(function (r) { var ses = r.data.session; if (ses) { TOKEN = ses.access_token; entrar(); } else login(); });
})();
</script>
</body>
</html>
