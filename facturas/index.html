<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1f3a">
<title>Facturas NWS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#0b1f3a;--gray:#5b6b80;--line:#e2e8f0;--cyan:#1aa3e0;--cyan-d:#0b7fb3;--amber:#b45309;--amber-bg:#fff7e6;--green:#047857;--green-bg:#e8f8f0;--blue-bg:#eaf5fd;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Public Sans",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px max(16px,env(safe-area-inset-left)) 14px max(16px,env(safe-area-inset-right))}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:26px}
.top h1{font:800 18px Montserrat,sans-serif;margin:0;flex:1}
.quien{font-size:13px;opacity:.85}.quien button{background:none;border:0;color:#7dd3fc;text-decoration:underline;cursor:pointer;font:inherit}
main{padding:18px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi b{font:800 20px Montserrat,sans-serif}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:600 14px inherit;font-family:inherit;color:var(--gray);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.barra input{flex:1;min-width:140px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
button.b{font:600 14px "Public Sans",sans-serif;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--cyan);color:#fff;white-space:nowrap}
button.b:hover{background:var(--cyan-d)}button.b:disabled{opacity:.5;cursor:default}
button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}button.s:hover{background:#f8fafc}
button.g{background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--gray);padding:6px 10px;font:600 13px "Public Sans",sans-serif;cursor:pointer}button.g:hover{background:#eef2f6;color:var(--ink)}
.fila{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.cli{font-weight:700}.cli small{font-weight:400;color:var(--gray);margin-left:6px}
.glosa{font-size:14px;color:#334155;grid-column:1}
.monto{text-align:right;grid-row:1/3;grid-column:2}.monto b{font:800 17px Montserrat,sans-serif;display:block}.monto small{color:var(--gray);font-size:12px}
.meta{font-size:12px;color:var(--gray);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{border-radius:999px;padding:1px 9px;font-weight:600;font-size:12px}
.t-por{background:var(--amber-bg);color:var(--amber)}.t-emi{background:var(--blue-bg);color:var(--cyan-d)}.t-pag{background:var(--green-bg);color:var(--green)}
.acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.acc input[type=text]{width:110px}.acc input[type=date]{width:150px}
.acc .der{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.notas{grid-column:1/-1;background:#f8fafc;border-radius:8px;padding:10px;font-size:14px}
.nota{margin-bottom:6px}.nota b{font-size:12px;color:var(--gray)}
.notas form{display:flex;gap:6px;margin-top:6px}.notas form input{flex:1}
.nueva{background:var(--card);border:1px solid var(--cyan);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nueva label{font-size:12px;font-weight:600;color:var(--gray);display:flex;flex-direction:column;gap:4px}
.nueva input,.nueva select,.nueva textarea{width:100%}.nueva .x2{grid-column:span 2}.nueva .x4{grid-column:1/-1}
.vacio{text-align:center;color:var(--gray);padding:30px}
#aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90vw}
.bloq{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
.bloq h2{font:800 20px Montserrat,sans-serif;margin:0 0 6px}
.bloq .opts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
@media (max-width:700px){.resumen{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:15px}.fila{grid-template-columns:1fr}.monto{grid-row:auto;grid-column:1;text-align:left}.nueva{grid-template-columns:1fr 1fr}.nueva .x2{grid-column:1/-1}.acc .der{margin-left:0}}
</style>
</head>
<body>
<header><div class="wrap top"><img src="../sinthesi-cctv/logo.png" alt="NWS"><h1>Facturas</h1><div class="quien" id="quien"></div></div></header>
<main class="wrap" id="app"><p class="vacio">Cargando…</p></main>
<div id="aviso" role="status"></div>
<script>
(function () {
  var API = 'https://camuxwyvvldqlmsmfbju.supabase.co/functions/v1/facturas-contador';
  var K = (location.hash.match(/k=([\w-]+)/) || [])[1] || '';
  var app = document.getElementById('app');
  var guardar = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var leer = function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  var S = { filas: [], filtro: 'pend', q: '', abiertas: {}, nueva: false, quien: leer('nws-fact-quien') };
  var clp = function (n) { return '$' + Math.round(Number(n) || 0).toLocaleString('es-CL'); };
  var fch = function (d) { return d ? d.slice(0, 10).split('-').reverse().join('-') : ''; };
  var hoy = function () { var d = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4); return d.toISOString().slice(0, 10); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function aviso(t) { var a = document.getElementById('aviso'); a.textContent = t; a.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.style.display = 'none'; }, 3200); }
  function api(accion, datos) {
    return fetch(API, { method: 'POST', headers: { 'content-type': 'application/json', 'x-clave': K }, body: JSON.stringify(Object.assign({ accion: accion, quien: S.quien }, datos || {})) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error'); return j; }); });
  }
  function cargar() { return api('lista').then(function (j) { S.filas = j.filas; pintar(); }).catch(function (e) { app.innerHTML = '<div class="bloq"><h2>No se pudo abrir</h2><p>' + esc(e.message) + '</p></div>'; }); }
  function pintarQuien() {
    document.getElementById('quien').innerHTML = S.quien ? 'Hola, ' + esc(S.quien) + ' · <button id="cambiar">cambiar</button>' : '';
    var c = document.getElementById('cambiar'); if (c) c.onclick = function () { S.quien = ''; guardar('nws-fact-quien', ''); inicio(); };
  }
  function inicio() {
    pintarQuien();
    if (!K) { app.innerHTML = '<div class="bloq"><h2>Link incompleto</h2><p>Abre el link completo que te envió NWS.</p></div>'; return; }
    if (!S.quien) {
      app.innerHTML = '<div class="bloq"><h2>¿Quién eres?</h2><p>Para firmar las notas y los cambios.</p><div class="opts"><button class="b" data-q="Jerry">Jerry</button><button class="b" data-q="Contador">Contador</button></div></div>';
      app.querySelectorAll('[data-q]').forEach(function (b) { b.onclick = function () { S.quien = b.dataset.q; guardar('nws-fact-quien', S.quien); pintarQuien(); cargar(); }; });
      return;
    }
    cargar();
  }
  function visibles() {
    var q = S.q.toLowerCase();
    return S.filas.filter(function (f) {
      if (S.filtro === 'pend' && f.estado === 'Pagada') return false;
      if (S.filtro === 'pag' && f.estado !== 'Pagada') return false;
      return !q || [f.razon_social, f.glosa, f.folio, f.referencia, f.rut].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }
  function textoSII(f) {
    return ['Razón social: ' + f.razon_social, 'RUT: ' + (f.rut || 'pendiente'), f.orden_compra ? 'Orden de compra: ' + f.orden_compra : null, 'Forma de pago: ' + f.forma_pago,
      'Glosa: ' + f.glosa, 'Neto: ' + clp(f.neto) + ' · IVA: ' + clp(f.iva) + ' · Total: ' + clp(f.total), f.referencia ? 'Referencia: ' + f.referencia : null].filter(Boolean).join('\n');
  }
  function fila(f) {
    var tag = f.estado === 'Pagada' ? '<span class="tag t-pag">Pagada ' + fch(f.fecha_pago) + '</span>' : f.estado === 'Emitida' ? '<span class="tag t-emi">Facturada · folio ' + esc(f.folio) + '</span>' : '<span class="tag t-por">Por facturar</span>';
    var paso = f.estado === 'Por facturar'
      ? '<input type="text" inputmode="numeric" placeholder="N° folio" data-folio="' + f.id + '" aria-label="Folio"><input type="date" value="' + hoy() + '" data-fe="' + f.id + '" aria-label="Fecha de emisión"><button class="b" data-act="folio" data-id="' + f.id + '">Facturada</button>'
      : f.estado === 'Emitida'
        ? '<input type="date" value="' + hoy() + '" data-fp="' + f.id + '" aria-label="Fecha de pago"><button class="b" data-act="pagada" data-id="' + f.id + '">Marcar pagada</button>'
        : '';
    var n = f.notas.length, ult = f.notas[n - 1];
    var notas = S.abiertas[f.id] ? '<div class="notas">' + (n ? f.notas.map(function (x) { return '<div class="nota"><b>' + esc(x.autor_nombre) + ' · ' + fch(x.created_at) + '</b><br>' + esc(x.texto) + '</div>'; }).join('') : '<div class="nota" style="color:var(--gray)">Sin notas.</div>') +
      '<form data-nota="' + f.id + '"><input name="t" placeholder="Escribe una nota (ej.: falta OC, enviada al cliente)" autocomplete="off"><button class="b">Enviar</button></form></div>' : '';
    return '<div class="fila"><div><div class="cli">' + esc(f.razon_social) + '<small>' + esc(f.rut || '') + '</small></div></div>' +
      '<div class="monto"><b>' + clp(f.total) + '</b><small>' + clp(f.neto) + ' + IVA</small></div>' +
      '<div class="glosa">' + esc(f.glosa) + '</div>' +
      '<div class="meta">' + tag + '<span>' + esc(f.forma_pago) + '</span>' + (f.orden_compra ? '<span>· OC ' + esc(f.orden_compra) + '</span>' : '') + (f.referencia ? '<span>· ' + esc(f.referencia) + '</span>' : '') +
      (f.fecha_emision ? '<span>· emitida ' + fch(f.fecha_emision) + '</span>' : '') + (ult && !S.abiertas[f.id] ? '<span>· <b>' + esc(ult.autor_nombre) + ':</b> ' + esc(ult.texto.slice(0, 60)) + '</span>' : '') + '</div>' +
      '<div class="acc">' + paso + '<div class="der">' +
      (f.pdf ? '<button class="g" data-act="ver" data-id="' + f.id + '">Ver PDF</button>' : '') +
      '<button class="g" data-act="pdf" data-id="' + f.id + '">' + (f.pdf ? 'Cambiar PDF' : 'Subir PDF') + '</button>' +
      '<button class="g" data-act="copiar" data-id="' + f.id + '">Copiar datos</button>' +
      '<button class="g" data-act="notas" data-id="' + f.id + '">Notas' + (n ? ' (' + n + ')' : '') + '</button>' +
      (f.estado === 'Por facturar' ? '<button class="g" data-act="quitar" data-id="' + f.id + '">Quitar</button>' : '') +
      '</div></div>' + notas + '</div>';
  }
  function pintar() {
    var por = S.filas.filter(function (f) { return f.estado === 'Por facturar'; }), emi = S.filas.filter(function (f) { return f.estado === 'Emitida'; });
    var mes = hoy().slice(0, 7), pag = S.filas.filter(function (f) { return f.estado === 'Pagada' && String(f.fecha_pago).slice(0, 7) === mes; });
    var suma = function (l) { return clp(l.reduce(function (s, f) { return s + Number(f.total); }, 0)); };
    var v = visibles();
    app.innerHTML =
      '<div class="resumen"><div class="kpi"><span>Por facturar (' + por.length + ')</span><b>' + suma(por) + '</b></div><div class="kpi"><span>Por cobrar (' + emi.length + ')</span><b>' + suma(emi) + '</b></div><div class="kpi"><span>Pagado este mes</span><b>' + suma(pag) + '</b></div></div>' +
      '<div class="barra"><button class="chip" data-f="pend" aria-pressed="' + (S.filtro === 'pend') + '">Pendientes</button><button class="chip" data-f="pag" aria-pressed="' + (S.filtro === 'pag') + '">Pagadas</button><button class="chip" data-f="todas" aria-pressed="' + (S.filtro === 'todas') + '">Todas</button>' +
      '<input type="search" id="q" placeholder="Buscar cliente, folio, glosa…" value="' + esc(S.q) + '"><button class="b" id="nueva">+ Agregar factura</button></div>' +
      (S.nueva ? '<form class="nueva" id="fnueva"><label class="x2">Cliente (razón social)<input name="razon_social" required list="clientes"></label><label>RUT<input name="rut" placeholder="88.446.500-1"></label><label>Forma de pago<select name="forma_pago"><option>Contado</option><option selected>30 días</option><option>45 días</option><option>60 días</option></select></label>' +
        '<label class="x4">Glosa (lo que dice la factura)<textarea name="glosa" rows="2" required></textarea></label><label>Neto $<input name="neto" type="number" min="1" required inputmode="numeric"></label><label>OC<input name="orden_compra"></label><label class="x2">Referencia<input name="referencia" placeholder="N° cotización, contrato"></label>' +
        '<div class="x4" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="b s" id="cancelar">Cancelar</button><button class="b">Agregar</button></div>' +
        '<datalist id="clientes">' + Array.from(new Set(S.filas.map(function (f) { return f.razon_social; }))).map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></form>' : '') +
      (v.length ? v.map(fila).join('') : '<p class="vacio">' + (S.filtro === 'pag' ? 'Aún no hay facturas pagadas.' : 'No hay nada pendiente. 🎉') + '</p>');
    enlazar();
  }
  function enlazar() {
    app.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { S.filtro = b.dataset.f; pintar(); }; });
    var q = document.getElementById('q'); q.oninput = function () { S.q = q.value; var p = q.selectionStart; pintar(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(p, p); };
    document.getElementById('nueva').onclick = function () { S.nueva = !S.nueva; pintar(); };
    var fn = document.getElementById('fnueva');
    if (fn) {
      document.getElementById('cancelar').onclick = function () { S.nueva = false; pintar(); };
      fn.onsubmit = function (e) {
        e.preventDefault(); var d = Object.fromEntries(new FormData(fn));
        var rut = S.filas.find(function (f) { return f.razon_social === d.razon_social && f.rut; }); if (!d.rut && rut) d.rut = rut.rut;
        api('agregar', d).then(function () { S.nueva = false; aviso('Agregada a «Por facturar».'); cargar(); }).catch(function (e) { aviso(e.message); });
      };
    }
    app.querySelectorAll('form[data-nota]').forEach(function (f) {
      f.onsubmit = function (e) {
        e.preventDefault(); var t = f.t.value.trim(); if (!t) return;
        api('nota', { id: f.dataset.nota, texto: t }).then(function () { aviso('Nota guardada.'); cargar(); }).catch(function (e) { aviso(e.message); });
      };
    });
    app.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.id, f = S.filas.find(function (x) { return x.id === id; }), act = b.dataset.act;
        var hecho = function (t) { return function () { aviso(t); cargar(); }; }, mal = function (e) { b.disabled = false; aviso(e.message); };
        if (act === 'notas') { S.abiertas[id] = !S.abiertas[id]; pintar(); return; }
        if (act === 'copiar') { navigator.clipboard.writeText(textoSII(f)).then(function () { aviso('Datos copiados para el SII.'); }, function () { aviso('No se pudo copiar.'); }); return; }
        if (act === 'folio') {
          var folio = app.querySelector('[data-folio="' + id + '"]').value.trim(); if (!folio) { aviso('Escribe el N° de folio.'); return; }
          b.disabled = true; api('folio', { id: id, folio: folio, fecha_emision: app.querySelector('[data-fe="' + id + '"]').value }).then(hecho('Factura ' + folio + ' registrada.'), mal); return;
        }
        if (act === 'pagada') { b.disabled = true; api('pagada', { id: id, fecha_pago: app.querySelector('[data-fp="' + id + '"]').value }).then(hecho('Marcada como pagada.'), mal); return; }
        if (act === 'quitar') {
          if (b.dataset.ok) { b.disabled = true; api('anular', { id: id }).then(hecho('Quitada de la lista.'), mal); return; }
          b.dataset.ok = '1'; b.textContent = '¿Seguro? Quitar'; b.style.color = 'var(--red)'; return;
        }
        if (act === 'ver') { var w = window.open('', '_blank'); api('ver_pdf', { id: id }).then(function (j) { if (w) w.location.href = j.url; else location.href = j.url; }, function (e) { if (w) w.close(); aviso(e.message); }); return; }
        if (act === 'pdf') {
          var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf';
          inp.onchange = function () {
            var file = inp.files[0]; if (!file) return; aviso('Subiendo PDF…');
            api('subir_pdf', { id: id }).then(function (j) {
              return fetch(j.url, { method: 'PUT', headers: { 'content-type': 'application/pdf', 'x-upsert': 'false' }, body: file }).then(function (r) { if (!r.ok) throw new Error('No se pudo subir el PDF.'); return api('pdf_listo', { id: id, path: j.path }); });
            }).then(hecho('PDF subido.'), mal);
          };
          inp.click();
        }
      };
    });
  }
  inicio();
})();
</script>
</body>
</html>
