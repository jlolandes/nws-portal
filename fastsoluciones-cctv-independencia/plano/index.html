<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plano CCTV FastSoluciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#eef0ec; --sheet:#fbfbf8; --field:#ffffff; --ink:#17201c; --ink2:#46514c; --muted:#6c7771; --rule:#cfd4ce; --rule2:#e2e5e0;
  --hover:rgba(23,32,28,.055); --accent:#0e5a73; --accent-ink:#ffffff; --map:#27302c;
  --warn:#b35c00; --warn-bg:#fff1dc; --info:#2b5f8a; --info-bg:#e6f0f8; --ok:#2b7a4b; --ok-bg:#e3f4ea; --bad:#c92a2a;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root.nws-dark{
  color-scheme:dark;
  --paper:#101513; --sheet:#171d1a; --field:#1d2521; --ink:#e8ece9; --ink2:#bcc5c0; --muted:#8f9a94; --rule:#35403b; --rule2:#252e2a;
  --hover:rgba(255,255,255,.055); --accent:#5fb3cf; --accent-ink:#0b1a20; --map:#0d1210;
  --warn:#f0a44b; --warn-bg:#3a2a12; --info:#8cbfe6; --info-bg:#172a3a; --ok:#6fcf97; --ok-bg:#16301f; --bad:#ff8787;}}
:root.nws-dark{
  color-scheme:dark;
  --paper:#101513; --sheet:#171d1a; --field:#1d2521; --ink:#e8ece9; --ink2:#bcc5c0; --muted:#8f9a94; --rule:#35403b; --rule2:#252e2a;
  --hover:rgba(255,255,255,.055); --accent:#5fb3cf; --accent-ink:#0b1a20; --map:#0d1210;
  --warn:#f0a44b; --warn-bg:#3a2a12; --info:#8cbfe6; --info-bg:#172a3a; --ok:#6fcf97; --ok-bg:#16301f; --bad:#ff8787;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:flex-end;gap:10px 24px;flex-wrap:wrap;padding:12px 20px 0;background:var(--sheet);border-bottom:1px solid var(--rule)}
.brand{padding-bottom:11px;min-width:0}
.brand .code{font-size:12px;color:var(--muted);letter-spacing:.06em;font-stretch:80%}
.brand h1{margin:1px 0 0;font-size:22px;line-height:1.1;font-weight:680;font-stretch:72%;text-wrap:balance}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 13px 11px;font-size:14px;font-weight:560;color:var(--ink2);white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700}
.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:9px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--rule);background:var(--field);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn svg{width:16px;height:16px;flex:none}
.dirty.ok{color:var(--ok)}
.dirty{font-size:12.5px;color:var(--warn);font-weight:600;padding:0 4px}

#app{display:flex;flex-direction:column;height:100%}
.top{flex:none}
.view{display:none}
.view.on{display:block;flex:1;min-height:0;overflow:auto}

/* ---------- lámina ---------- */
#v-plano.on{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:540px;overflow:hidden}
.map{position:relative;overflow:hidden;background:var(--map);touch-action:none;cursor:grab}
.map.cad{background:#dfe2dc}
.basesel{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:6px}
.basesel button{flex:1;border:none;background:var(--field);padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.basesel button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.map.drag{cursor:grabbing}
.map.tool{cursor:crosshair}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.ctl button,.ctl a{display:grid;place-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-width:36px;height:36px;font-size:17px;font-weight:600;color:var(--ink);text-decoration:none}
.ctl .t{font-size:12px;padding:0 8px}
.ctl button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.legfloat{position:absolute;left:12px;top:12px;width:250px;max-height:calc(100% - 90px);overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:3}
.legfloat[hidden]{display:none}
.map .pkt,.map .scan,.map .beat,.map .alarm{display:none}
.map.anim .pkt,.map.anim .scan,.map.anim .beat,.map.anim .alarm{display:inline}
.map.anim .pkt{animation:pkt 1.4s linear infinite}
.map.anim .pkt.fibra{animation-duration:.9s}
.map.anim .pkt.utp{animation-duration:1.8s}
.map.anim .pkt.radio{animation-name:pktr;animation-duration:1.3s}
.map.anim .pkt.rev{animation-direction:reverse}
@keyframes pkt{from{stroke-dashoffset:0}to{stroke-dashoffset:-25}}
@keyframes pktr{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
.map .scan{transform-box:view-box;pointer-events:none}
.map.anim .scan{animation:scan 3.2s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes scan{0%{transform:scale(.06);opacity:.42}80%{opacity:.06}100%{transform:scale(1);opacity:0}}
.map .beat{transform-box:fill-box;transform-origin:center;pointer-events:none}
.map.anim .beat{animation:beat 2.4s ease-out infinite}
.map.anim .beat.b2{animation-delay:1.2s}
.map.anim .beat.wave{animation-duration:1.8s}
@keyframes beat{0%{transform:scale(.9);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.map.anim .alarm{animation:alarm 1s ease-in-out infinite;pointer-events:none}
@keyframes alarm{0%,100%{opacity:1}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.map.anim .scan,.map.anim .beat{animation-duration:6s}}
.toolbar:not([hidden]) ~ .legfloat{left:66px;top:12px}
.toolbar #tOrtho[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok)}
.legfloat .lfh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.legfloat .lfh b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legfloat .lfh button{background:none;border:none;font-size:18px;line-height:1;color:var(--muted);width:26px;height:26px;border-radius:4px}
.legfloat .legend{font-size:12px;gap:5px 8px;grid-template-columns:30px 1fr}
.map .legfloat svg{position:static;inset:auto;width:30px;height:18px;overflow:visible}
.legfloat .lfc{margin-top:10px;padding-top:8px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink2);line-height:1.45}
.legfloat .lfc b{color:var(--ink)}
@media (max-width:900px){.legfloat{width:210px;top:auto;bottom:70px;max-height:45%}}
.ctl button:hover,.ctl a:hover{border-color:var(--muted)}
.status{position:absolute;left:12px;bottom:12px;display:flex;gap:14px;align-items:flex-end;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 10px 7px;font-size:11.5px;color:var(--ink2);max-width:calc(100% - 90px);flex-wrap:wrap}
.scalebar .bar{display:flex;height:6px;margin-top:4px;border:1px solid var(--ink)}
.scalebar .bar i{flex:1}
.scalebar .bar i:nth-child(odd){background:var(--ink)}
.coords{font-variant-numeric:tabular-nums;white-space:nowrap}
.northar{position:absolute;right:12px;bottom:12px;width:44px;height:52px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;display:grid;place-items:center}
.northar svg{width:30px;height:42px;color:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--sheet);font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-150%);display:none;z-index:3}
.toolbar{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:4px;z-index:2}
.toolbar .sep{height:1px;background:var(--rule);margin:3px 4px}
.toolbar button{display:grid;place-items:center;width:38px;height:36px;border:none;border-radius:5px;background:none;color:var(--ink);position:relative}
.toolbar button svg{width:20px;height:20px}
.toolbar button:hover{background:var(--hover)}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hintbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:13px;padding:7px 12px;border-radius:6px;max-width:calc(100% - 140px);text-align:center;z-index:2}
.draft{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--sheet);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:3;max-width:calc(100% - 32px)}

.side{background:var(--sheet);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;min-height:0;overflow:auto;padding:16px 18px}
.side-scroll>section+section{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule2)}
h2.lbl{margin:0 0 8px;font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-stretch:85%}
.secrow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:6px 8px;margin:0 -8px;width:calc(100% + 16px)}
.secrow:hover{background:var(--hover)}
.secrow[aria-pressed="true"]{background:var(--hover);border-color:var(--rule)}
.secrow .sw{width:12px;height:12px;border-radius:2px;background:var(--c)}
.secrow b{font-weight:600}
.secrow small{display:block;color:var(--muted);font-size:12px}
.secrow .n{color:var(--ink2);font-size:12.5px;text-align:right}
.meter{display:block;width:64px;height:4px;border-radius:2px;background:var(--rule2);margin-top:4px;margin-left:auto;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.layers{display:grid;gap:5px}
.layers label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px}
.legend{display:grid;grid-template-columns:34px 1fr;gap:7px 10px;align-items:center;font-size:13px;color:var(--ink2)}
.legend svg{width:34px;height:20px;overflow:visible}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ficha / formulario */
.card{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
.card .h{display:flex;align-items:center;gap:10px}
.card .tag{display:grid;place-items:center;min-width:38px;height:26px;padding:0 7px;border-radius:13px;background:var(--c);color:#fff;font-weight:700;font-size:14px}
.card .ico{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--sheet);border:1px solid var(--rule)}
.card .ico svg{width:18px;height:18px}
.card h3{margin:0;font-size:16px;font-weight:650;font-stretch:85%;line-height:1.2}
.card .sub{font-size:12px;color:var(--muted)}
.card .x{margin-left:auto;background:none;border:none;font-size:18px;width:30px;height:30px;border-radius:4px;color:var(--muted);flex:none}
.card .x:hover{background:var(--hover)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pending{color:var(--muted);font-style:italic}
.card a{color:var(--accent);font-weight:600}
.form{display:grid;gap:9px;margin-top:10px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{width:100%;background:var(--field);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.f textarea{resize:vertical;min-height:54px}
.f input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent)}
.f .rv{display:flex;justify-content:space-between;color:var(--ink2)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.btn.sm{height:30px;font-size:12.5px;padding:0 10px}
.btn.del{color:var(--bad)}

.qcam{width:100%;background:var(--field);border:1px solid var(--rule);border-radius:6px;height:34px;padding:0 10px;font-size:13.5px}
.stbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--rule2);margin:6px 0 8px}
.stbar i{display:block;height:100%}
.stleg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px;font-size:12.5px;color:var(--ink2)}
.stleg span{display:flex;align-items:center;gap:6px}
.stleg em{width:9px;height:9px;border-radius:2px;flex:none}
.covline{display:grid;justify-items:start;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule2);font-size:13px}
.covline b{font-size:18px;font-stretch:80%}
.mlog{border-top:1px solid var(--rule);padding-top:10px;display:grid;gap:8px}
.mlog h4{margin:0;font-size:13px;font-weight:650}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.logl li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.logl .d{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.logl .x2{background:none;border:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
/* rótulo */
.rotulo{border-top:2px solid var(--ink);font-size:12px}
.rotulo .rh{display:flex;align-items:center;gap:10px;width:100%;background:var(--sheet);border:none;border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;cursor:pointer}
.rotulo .rh:hover{background:var(--hover)}
.rotulo .rh .rt{display:grid;min-width:0;flex:1}
.rotulo .rh .rt b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rotulo .rh .rs{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent);flex:none}
.rotulo .rh svg{width:12px;height:12px;transition:transform .15s}
.rotulo.closed .rh svg{transform:rotate(180deg)}
.rotulo.closed .rh{border-bottom:none}
.rotulo .rb{max-height:52vh;overflow:auto}
.rotulo .r{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.rotulo .c{padding:6px 10px;min-width:0}
.rotulo .c+.c{border-left:1px solid var(--rule)}
.rotulo .k{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-stretch:85%}
.rotulo .v{display:block;font-weight:600;font-size:13px}
.rotulo .full{grid-column:1/-1}
.rotulo .r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rotulo .big .v{font-size:16px;font-stretch:78%;font-weight:680}
.rotulo .nws{display:flex;align-items:center;gap:8px}
.rotulo .mk{width:24px;height:22px;border-radius:4px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:750;font-size:10px;flex:none}

/* ---------- páginas ---------- */
.page{max-width:1200px;margin:0 auto;padding-block:22px 48px;padding-inline:20px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{margin:0;font-size:22px;font-weight:680;font-stretch:75%;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--ink2);max-width:68ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select,.tools input{background:var(--field);border:1px solid var(--rule);border-radius:6px;height:34px;padding:0 10px}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:13.5px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule2);vertical-align:top}
th{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sheet);position:sticky;top:0;font-stretch:85%;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
td.n{font-weight:700}

.netf{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.netf li{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;align-items:start;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px}
.netf li b{font-size:14px}
.netf li p{margin:3px 0 0;color:var(--ink2);font-size:13px;max-width:100ch}
.ubar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--rule2);vertical-align:middle;margin-right:8px;overflow:hidden}
.ubar i{display:block;height:100%;border-radius:4px}
.netdia{background:#fff;border:1px solid var(--rule);border-radius:8px;overflow-x:auto;padding:10px}
.netdia svg{display:block;max-width:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)}
.nsec{margin-top:28px}
.nt{min-width:0}
.nt tbody tr{cursor:default}
.nt td{white-space:nowrap}
.nt td.w{white-space:normal;min-width:200px}
.nt input,.nt select{width:100%;min-width:60px;background:var(--field);border:1px dashed var(--accent);border-radius:5px;padding:4px 6px;font-size:13px;color:var(--ink)}
.nt input[type=checkbox]{width:auto;min-width:0}
.nform{grid-template-columns:repeat(4,minmax(0,1fr))}
.nform input{width:100%;background:var(--field);border:1px dashed var(--accent);border-radius:5px;padding:6px 8px}
@media (max-width:760px){.netf li{grid-template-columns:1fr}.nform{grid-template-columns:1fr 1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.info{background:var(--info-bg);color:var(--info)}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--warn-bg);color:var(--bad)}
.tfoot{margin-top:10px;font-size:12.5px;color:var(--muted)}
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:16px}
.sumrow div{background:var(--sheet);padding:12px 16px}
.sumrow b{display:block;font-size:26px;font-weight:650;font-stretch:75%;line-height:1.1}
.sumrow span{font-size:12.5px;color:var(--muted)}
.topo{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow-x:auto;padding:18px}
.topo svg{display:block;min-width:960px;width:100%;height:auto}
.topo text{font-family:var(--font)}

/* observaciones */
.obsgrid{display:grid;gap:22px;max-width:900px}
.obs{display:grid;gap:10px}
.ob{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}

/* Orientación propuesta según el plano (azimut: 0 norte, 90 este).
   Reglas:
   1. Cámara montada en poste o gabinete: mira hacia afuera del poste, en la dirección de su rótulo en el plano.
   2. Cámaras perimetrales de un edificio: miran hacia afuera del edificio.
   3. Resto: mira hacia el interior de su sector (patio, estacionamiento o vía).
   Algunas cámaras tienen un criterio específico, anotado en AZ_RULES. */
const AZ_RULES={
 3:{az:190,fov:70,range:30,why:'Pista poniente hacia Alcalde Guzmán: vehículos que ingresan'},
 4:{az:180,fov:90,range:25,why:'Portones y vereda de Alcalde Guzmán'},

 12:{az:180,fov:90,range:25,why:'Costado sur del edificio y jardín'},
 13:{az:180,fov:90,range:30,why:'Estacionamiento sur del edificio principal'},

 18:{az:0,fov:80,range:35,why:'Fachada norte de la bodega del sector F'},
 19:{az:0,fov:80,range:35,why:'Fachada norte de la bodega del sector F'}
};
const PERIM={ids:[27,28,29,30],cx:985,cy:215,why:'Perímetro del galpón central, hacia afuera'};
function proposeAz(c,nodes,sectors){
  const az=(dx,dy)=>Math.round(((Math.atan2(dy,dx)*180/Math.PI)+360)%360);
  if(AZ_RULES[c.n])return Object.assign({},AZ_RULES[c.n]);
  if(PERIM.ids.includes(c.n))return{az:az(c.x-PERIM.cx,c.y-PERIM.cy),fov:90,range:30,why:PERIM.why};
  if(c.mount){const n=nodes.find(q=>q.id===c.mount);if(n&&Math.hypot(c.x-n.x,c.y-n.y)>1)return{az:az(c.x-n.x,c.y-n.y),fov:80,range:32,why:'Hacia afuera del poste, según el rótulo del plano'};}
  if(c.mount){const n=nodes.find(q=>q.id===c.mount);if(n&&Math.hypot(c.x-n.x,c.y-n.y)>1)return{az:az(c.x-n.x,c.y-n.y),fov:80,range:32,why:'Hacia afuera del poste, según el rótulo del plano'};}
  if(c.sec&&sectors[c.sec]){const[x,y,w,h]=sectors[c.sec].r,cx=x+w/2,cy=y+h/2;if(Math.hypot(c.x-cx,c.y-cy)>3)return{az:az(cx-c.x,cy-c.y),fov:90,range:35,why:'Hacia el interior del sector'};}
  return{az:0,fov:90,range:25,why:'Sin referencia en el plano'};
}
const azTxt=c=>c.az==null?'':`${c.az}° ${cardinal(c.az)}${c.azEst?' (propuesta)':''}`;
function applyProposals(){const list=S.cams.filter(c=>c.az==null);if(!list.length){toast('Todas las cámaras ya tienen orientación.');return;}
  mutate('prop',()=>{for(const c of list){const p=proposeAz(c,S.nodes,S.sectors);c.az=p.az;c.fov=p.fov;c.range=p.range;c.azEst=true;c.azWhy=p.why;}});toast(`Orientación propuesta para ${list.length} ${list.length===1?'cámara':'cámaras'}. Ajústalas en su ficha o con la manilla del plano.`);}
function audit(){ // observaciones automáticas
  const out=[];
  const noSec=S.cams.filter(c=>!c.sec).map(c=>c.n);
  if(noSec.length)out.push({lvl:'warn',t:`${noSec.length===1?'Cámara':'Cámaras'} ${listN(noSec)} fuera de sector`,d:'No están dentro de ningún recuadro de sector. Asígnales un sector o amplía el recuadro correspondiente.',cam:noSec[0]});
  const noVia=S.cams.filter(c=>!c.via).map(c=>c.n);
  if(noVia.length)out.push({lvl:'warn',t:`${noVia.length===1?'Cámara':'Cámaras'} ${listN(noVia)} sin punto de enlace`,d:'No se indica a qué nodo, antena o gabinete se conectan. Defínelo en la ficha de cada cámara.',cam:noVia[0]});
  for(const n of S.nodes){if(n.id==='C0')continue;const cs=S.cams.filter(c=>c.via===n.id).map(c=>c.n);if(!cs.length)continue;
    if(!pathToCentral(n.id))out.push({lvl:'warn',t:`${n.name} sin enlace al nodo central`,d:`Conecta ${cs.length===1?'la cámara':'las cámaras'} ${listN(cs)}, pero no hay fibra, radioenlace ni UTP que la una con el nodo central.`,node:n.id});}
  const seen={};for(const c of S.cams){(seen[c.n]=seen[c.n]||[]).push(c);}
  for(const k in seen)if(seen[k].length>1)out.push({lvl:'warn',t:`Número de cámara ${k} repetido`,d:'Dos cámaras comparten el mismo número. Renumera una de ellas.',cam:+k});
  for(const l of S.links){if(l.a&&l.b)continue;const nm=l.name||LTYPE[l.type].l;
    out.push({lvl:'warn',t:`${LTYPE[l.type].l} ${fmtM(linkLen(l))}: ${l.a||l.b?'un extremo':'ambos extremos'} sin conectar`,d:`"${nm}" no termina en un equipo, por eso no aparece en el diagrama unifilar. Agrega un sitio, gabinete o caja en el extremo libre y elígelo en Desde o Hasta de su ficha, o arrastra el punto final sobre el equipo.`,link:l.id});}
  const fall=S.cams.filter(c=>c.status==='falla').map(c=>c.n);
  if(fall.length)out.push({lvl:'warn',t:`${fall.length===1?'Cámara':'Cámaras'} ${listN(fall)} con falla`,d:'Marcadas con falla en el levantamiento. Programar visita de mantención.',cam:fall[0]});
  const noAz=S.cams.filter(c=>c.az==null).length;
  if(noAz)out.push({lvl:'info',t:`${noAz} de ${S.cams.length} cámaras sin orientación`,d:'Sin la orientación no se puede dibujar su cono ni calcular la cobertura del sector. En modo edición, usa Proponer orientaciones o regístrala en la ficha de cada cámara.'});
  const est=S.cams.filter(c=>c.az!=null&&c.azEst).length;
  if(est)out.push({lvl:'info',t:`${est} de ${S.cams.length} orientaciones propuestas, por confirmar en terreno`,d:'NWS las propuso según la posición de cada cámara en el plano: las de poste miran hacia afuera del poste, las perimetrales hacia afuera del edificio y el resto hacia el interior de su sector. La cobertura por sector es una estimación mientras no se confirmen. Al ajustar una orientación en la ficha queda como confirmada.'});
  return out;}
let _blind={key:null};
function blindSpots(){const cams=S.cams.filter(c=>c.az!=null&&c.status!=='retiro'),key=JSON.stringify(cams.map(c=>[c.x,c.y,c.az,c.fov,coneR(c)]))+ppm();if(_blind.key===key)return _blind;
  const st=2*ppm(),runs=[];let tot=0,cov=0;
  for(let x=st/2;x<IW;x+=st){let run=null;for(let y=st/2;y<IH;y+=st){const inside=inPoly(x,y,BASEMAP.site)&&!bldAt(x,y)&&!BASEMAP.green.some(g=>inPoly(x,y,g));let covered=false;
      if(inside){tot++;for(const c of cams){const dx=x-c.x,dy=y-c.y;if(Math.hypot(dx,dy)>coneR(c)*ppm())continue;if(c.fov>=359){covered=true;break;}let da=Math.abs(azOf(dx,dy)-c.az);if(da>180)da=360-da;if(da<=c.fov/2){covered=true;break;}}if(covered)cov++;}
      if(inside&&!covered){if(!run)run={x:x-st/2,y0:y-st/2,y1:y+st/2};else run.y1=y+st/2;}else if(run){runs.push(run);run=null;}}
    if(run)runs.push(run);}
  _blind={key,runs,st,pct:tot?Math.round(cov/tot*100):null,area:Math.round((tot-cov)*4)};return _blind;}
function listN(a){a=[...a].sort((x,y)=>x-y);if(a.length<=1)return String(a[0]??'');return a.slice(0,-1).join(', ')+' y '+a[a.length-1];}

function pushUndo(){undoStack.push(JSON.stringify(S));if(undoStack.length>80)undoStack.shift();redoStack=[];}
function mutate(key,fn){const now=Date.now();if(key!==lastMut.k||now-lastMut.t>1500)pushUndo();lastMut={k:key,t:now};fn();changed();}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(S));S=JSON.parse(undoStack.pop());lastMut={k:null,t:0};if(sel&&!getSel())sel=null;changed(true);}

  clearTimeout(draftTimer);draftTimer=setTimeout(()=>{try{if(isDirty())stash();else{localStorage.removeItem(DRAFT_KEY);sessionStorage.removeItem(DRAFT_KEY);}}catch(e){}},400);}
const isDirty=()=>JSON.stringify(S)!==savedJSON;
let autoT=0,autoBusy=false,autoLast=0,autoMsg='';
function stash(){try{const v=JSON.stringify({base:S0saved(),state:S});localStorage.setItem(DRAFT_KEY,v);sessionStorage.setItem(DRAFT_KEY,v);}catch(e){}}
function scheduleAuto(){if(readOnly||!art||!canEditFlag)return;clearTimeout(autoT);autoT=setTimeout(autoSave,4000);}
async function autoSave(force){if(!isDirty()||readOnly||!art)return true;if(autoBusy){scheduleAuto();return false;}
  const wait=8000-(Date.now()-autoLast);if(wait>0&&!force){clearTimeout(autoT);autoT=setTimeout(autoSave,wait);return false;}
  autoBusy=true;autoMsg='Guardando…';renderTop();stash();
  const snap=clone(S);snap.savedAt=new Date().toISOString();snap.revs[snap.revs.length-1].date=today();
  const res=await publishState(snap);autoBusy=false;autoLast=Date.now();
  if(res.ok){S.savedAt=snap.savedAt;S.revs[S.revs.length-1].date=snap.revs[snap.revs.length-1].date;savedJSON=JSON.stringify(snap);
    if(!isDirty()){try{localStorage.removeItem(DRAFT_KEY);sessionStorage.removeItem(DRAFT_KEY);}catch(e){}}else scheduleAuto();
    const d=new Date(),z=n=>String(n).padStart(2,'0');autoMsg=`Guardado ${z(d.getHours())}:${z(d.getMinutes())}`;renderTop();return true;}
  if(['not_writer','not_granted','consent_required'].includes(res.code)){readOnly=true;autoMsg='';renderTop();toast('Esta vista es de solo lectura. Tus cambios quedan como borrador en este navegador.');return false;}
  if(res.code==='stale'){autoMsg='';renderTop();reloadStale();return false;}
  if(res.code==='conflict'){autoMsg='';toast('Había una versión más nueva de la página. Se recargará y tus cambios se recuperan automáticamente.');return false;}
  autoMsg='Sin guardar';renderTop();if(res.code==='rate_limited'||res.code==='upstream_error'){clearTimeout(autoT);autoT=setTimeout(autoSave,15000);}return false;}

    else if(a==='reset')repSet(()=>{S.rep.mant=clone(MANT0);},true);
    else if(a==='jadd')repSet(()=>{S.rep.mej.push({a:'Nueva mejora',p:'Media',t:PLAZOS[1],b:''});},true);

    else if(a==='sadd')repSet(()=>{S.rep.sem.push({i:'Nuevo indicador',e:'ok',c:''});},true);
    else if(a==='sdel')repSet(()=>{S.rep.sem.splice(+t.dataset.i,1);},true);
    else if(a==='radd')repSet(()=>{S.sys.res.push(['Otra',0]);},true);

/* f6: informe conectado a la OT, renovación y separación de cámaras amontonadas */
function otInfo(){const h=(S.otHist||[])[0],st=otStats(),cur=S.ot;const out={lines:[],chg:[]};
  const sl=k=>(STATUS[k]&&STATUS[k].l)||k||'';
  if(h){out.title=`Orden de trabajo de ${ymLbl(h.mes)} (cerrada)`;
    out.lines.push(`Visita del ${fmtD(h.fecha)}${h.tec?', a cargo de '+h.tec:''}. Se revisaron ${h.n} ${h.n===1?'cámara':'cámaras'} (avance ${h.pct} %): limpieza de lente y domo, enfoque y verificación de grabación.`);
    if(h.actsL&&h.actsL.length)out.lines.push(`Actividades de la pauta cumplidas: ${h.actsL.join('; ')}.`);
    if(h.nota)out.lines.push(`Observaciones del técnico: ${h.nota}`);
    out.chg=(h.chg||[]).map(([n,a,b])=>[n,sl(a),sl(b)]);
    if(cur&&cur.mes!==h.mes&&st.d)out.lines.push(`Orden de ${ymLbl(cur.mes)} en curso: ${st.d} de ${st.t} revisiones (${st.pct} %).`);}
  else if(cur&&st.d){out.title=`Orden de trabajo de ${ymLbl(cur.mes)} (en curso)`;out.lines.push(`Avance ${st.pct} %: ${st.d} de ${st.t} revisiones registradas${cur.tec?', técnico '+cur.tec:''}. Se registra en la bitácora de cada cámara al cerrarla.`);}
  else return null;return out;}

const RSPEC={b4:'Cámara bala IP 4 MP, lente 2,8 mm, IR 30 m, WDR',d4:'Cámara domo IP 4 MP, lente 2,8 mm, IR 30 m, WDR',b8:'Cámara bala IP 8 MP (4K), lente 2,8 mm, IR 40 m',d8:'Cámara domo IP 8 MP (4K), lente 2,8 mm, IR 30 m',bv:'Cámara bala IP 4 MP varifocal 2,7–13,5 mm, IR 50 m',ptz:'Cámara PTZ IP 4 MP, zoom óptico 25x, IR 100 m',fe:'Cámara ojo de pez IP 12 MP, 360°'};
const renoCur=()=>S.reno||{sel:{},spec:{},precio:{},inst:0,mat:0};
function renoEnsure(){if(!S.reno)S.reno=renoCur();return S.reno;}
function renoWhy(c){const w=[];if(c.status==='falla')w.push('Con falla');if(c.status==='cambio')w.push('Para cambio');const Y=camYear(c);if(Y&&NOWY-Y.y>=5)w.push(`${NOWY-Y.y} años${Y.est?' (estimado)':''}`);if(fwRisk(c))w.push('Firmware vulnerable');return w;}
function renoDef(c){const r=RES_PX[c.res]||RES_PX[majRes()]||1920;if(c.type==='ptz')return'ptz';if(c.type==='fisheye')return'fe';if(c.range>=35&&c.type!=='domo')return'bv';if(c.type==='domo')return r>=3840?'d8':'d4';return r>=3840?'b8':'b4';}
function renoData(){const R=renoCur(),cands=S.cams.filter(c=>c.status!=='retiro'&&renoWhy(c).length).sort((a,b)=>a.n-b.n);
  const rows=cands.map(c=>({c,why:renoWhy(c),on:R.sel[c.id]!==false,spec:R.spec[c.id]||renoDef(c)}));
  const g={};for(const r of rows)if(r.on){g[r.spec]=(g[r.spec]||0)+1;}
  const groups=Object.keys(RSPEC).filter(k=>g[k]).map(k=>({k,d:RSPEC[k],q:g[k],p:+R.precio[k]||0}));
  const n=rows.filter(r=>r.on).length,eq=groups.reduce((a,x)=>a+x.q*x.p,0),inst=n*(+R.inst||0),mat=+R.mat||0,net=eq+inst+mat;
  return{R,rows,groups,n,eq,inst,mat,net,iva:Math.round(net*.19),tot:Math.round(net*1.19)};}
const clp=v=>'$'+Math.round(v||0).toLocaleString('es-CL');

/* f19: etiquetas QR por cámara (PDF para imprimir) y apertura directa de la ficha */
function qrMatrix(text){
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26],NB=[-1,1,1,1,2,2,4,4,4,5,5];
  const bytes=[...new TextEncoder().encode(text)];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
  const dcw=v=>Math.floor(raw(v)/8)-ECC[v]*NB[v];
  let ver=1;for(;ver<=10;ver++){const cc=ver<10?8:16;if(4+cc+8*bytes.length<=dcw(ver)*8)break;}
  if(ver>10)throw new Error('texto muy largo para el QR');
  const size=ver*4+17,cc=ver<10?8:16;
  const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1);};
  put(4,4);put(bytes.length,cc);for(const b of bytes)put(b,8);
  const cap=dcw(ver)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
  for(let p=0xEC;data.length<dcw(ver);p^=0xEC^0x11)data.push(p);
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;};
  const eccLen=ECC[ver],nb=NB[ver],rawCw=Math.floor(raw(ver)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb);
  const div=[];for(let i=0;i<eccLen-1;i++)div.push(0);div.push(1);let root=1;
  for(let i=0;i<eccLen;i++){for(let j=0;j<div.length;j++){div[j]=mul(div[j],root);if(j+1<div.length)div[j]^=div[j+1];}root=mul(root,2);}
  const rem=d=>{const r=div.map(()=>0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f));}return r;};
  const blocks=[];for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-eccLen+(i<nShort?0:1));k+=dat.length;const e=rem(dat);if(i<nShort)dat.push(0);blocks.push(dat.concat(e));}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-eccLen||j>=nShort)all.push(b[i]);});
  const M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
  const sf=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
  for(let i=0;i<size;i++){sf(6,i,i%2===0);sf(i,6,i%2===0);}
  const fp=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)sf(xx,yy,d!==2&&d!==4);}};
  fp(3,3);fp(size-4,3);fp(3,size-4);
  if(ver>1){const n=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(pos[i]+dx,pos[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}}
  const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)sf(8,i,g(i));sf(8,7,g(6));sf(8,8,g(7));sf(7,8,g(8));for(let i=9;i<15;i++)sf(14-i,8,g(i));
    for(let i=0;i<8;i++)sf(size-1-i,8,g(i));for(let i=8;i<15;i++)sf(8,size-15+i,g(i));sf(8,size-8,true);};
  fmt(0);
  if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const c=((b>>>i)&1)===1,a=size-11+i%3,bb=Math.floor(i/3);sf(a,bb,c);sf(bb,a,c);}}
  let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)===1;i++;}}}
  const cond=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const am=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&cond[m](x,y))M[y][x]=!M[y][x];};
  const pen=()=>{let p=0,dark=0;for(let y=0;y<size;y++){let rx=1,ry=1;for(let x=0;x<size;x++){if(M[y][x])dark++;
      if(x>0){if(M[y][x]===M[y][x-1]){rx++;if(rx===5)p+=3;else if(rx>5)p++;}else rx=1;}
      if(x>0){if(M[x][y]===M[x-1][y]){ry++;if(ry===5)p+=3;else if(ry>5)p++;}else ry=1;}
      if(x>0&&y>0){const c=M[y][x];if(c===M[y][x-1]&&c===M[y-1][x]&&c===M[y-1][x-1])p+=3;}}}
    const k=Math.ceil(Math.abs(dark*20-size*size*10)/(size*size))-1;return p+Math.max(0,k)*10;};
  let best=0,bp=1e9;for(let m=0;m<8;m++){am(m);fmt(m);const q=pen();if(q<bp){bp=q;best=m;}am(m);}
  am(best);fmt(best);return M;}
